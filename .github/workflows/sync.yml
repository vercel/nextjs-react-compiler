name: Sync React Compiler
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Git ref or commit SHA to sync from (default: tip of pull/36173/head)"
        type: string
        default: pull/36173/head

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@e75cfd3544e409eb8da0d09dd5d918cd3e6e3982 # just

      - name: Create sync branch
        run: |
          BRANCH="sync/react-compiler-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Sync upstream
        run: just pr_ref="${{ inputs.upstream_ref }}" sync

      - name: Run codemod
        run: just codemod

      - name: Commit codemod changes
        run: |
          git add -A react-compiler
          git diff --cached --quiet || git commit -m "run codemod"

      - name: Check for new commits
        id: changes
        run: |
          COUNT=$(git log "origin/main..HEAD" --oneline | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT new commit(s) ahead of origin/main"

      - name: Push and open PR
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$BRANCH"
          UPSTREAM=$(git log -1 --format='%s' | grep -oP '(?<=@ )\S+' || echo "unknown")
          gh pr create \
            --title "vendor: sync react-compiler upstream" \
            --body "Automated sync via \`just sync && just codemod\`. Ref: \`${{ inputs.upstream_ref }}\`, upstream commit: \`${UPSTREAM}\`." \
            --base main \
            --head "$BRANCH"
